name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e . --no-deps --no-build-isolation
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m compileall -q app mlforge scripts streamlit_app.py
      - run: python -m pytest -ra -o faulthandler_timeout=60
      - run: python -m mlforge.cli --home build/smoke-data smoke --task both --output build/smoke-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-results-${{ matrix.os }}-py${{ matrix.python }}
          path: build/smoke-results.json
